<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore Enzo Félix Martins' engineering portfolio: dependable software, data platforms, cloud foundations and the path toward intelligent systems."
    />
    <meta name="author" content="Enzo Félix Martins" />
    <meta name="application-name" content="NEXUS" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#03050a" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="NEXUS — Building Intelligent Systems" />
    <meta
      property="og:description"
      content="Explore Enzo Félix Martins' engineering portfolio: dependable software, data platforms, cloud foundations and the path toward intelligent systems."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXUS" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEXUS — Building Intelligent Systems" />
    <meta
      name="twitter:description"
      content="Explore Enzo Félix Martins' engineering portfolio: dependable software, data platforms, cloud foundations and the path toward intelligent systems."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/nexus-mark.svg"
    />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles/main.css" />
    <title>NEXUS — Building Intelligent Systems</title>
    <script id="site-structured-data" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "#nexus-website",
            "name": "NEXUS",
            "headline": "Building Intelligent Systems.",
            "description": "NEXUS is Enzo Félix Martins' engineering portfolio and technology laboratory for dependable software, data, cloud and intelligent systems.",
            "inLanguage": "en",
            "creator": { "@id": "#enzo-felix-martins" }
          },
          {
            "@type": "Person",
            "@id": "#enzo-felix-martins",
            "name": "Enzo Félix Martins",
            "jobTitle": "Software Engineering student",
            "sameAs": [
              "https://www.linkedin.com/in/enzo-f%C3%A9lix-martins-88b595219/",
              "https://github.com/enzodevn"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <section class="boot-screen" data-boot aria-labelledby="boot-title">
      <div class="boot-screen__field" aria-hidden="true">
        <span class="boot-screen__aurora"></span>
        <span class="boot-screen__grid"></span>
        <span class="boot-screen__scan"></span>
        <div class="boot-orbits">
          <span class="boot-orbit boot-orbit--outer"></span>
          <span class="boot-orbit boot-orbit--middle"></span>
          <span class="boot-orbit boot-orbit--inner"></span>
        </div>
      </div>

      <div class="boot-screen__topline" aria-hidden="true">
        <span>NXS / STARTUP SEQUENCE</span>
        <span class="boot-screen__signal"><i></i> SIGNAL LOCKED</span>
      </div>

      <div class="boot-screen__content">
        <div class="boot-core" aria-hidden="true">
          <span class="boot-core__halo"></span>
          <img src="./assets/nexus-mark.svg" alt="" />
          <span class="boot-core__index">01</span>
        </div>
        <p class="boot-screen__eyebrow">Engineering ecosystem</p>
        <h1 id="boot-title" class="boot-screen__title" aria-label="NEXUS">
          <span aria-hidden="true">N</span><span aria-hidden="true">E</span><span aria-hidden="true">X</span><span aria-hidden="true">U</span><span aria-hidden="true">S</span>
        </h1>
        <p class="boot-screen__descriptor">Building Intelligent Systems.</p>
      </div>

      <div class="boot-screen__footer">
        <div class="boot-progress">
          <div class="boot-progress__meta">
            <span data-boot-stage role="status" aria-live="polite">Establishing core link</span>
            <span><b data-boot-progress-value>000</b> / 100</span>
          </div>
          <div
            class="boot-progress__track"
            data-boot-progress
            role="progressbar"
            aria-label="NEXUS initialization progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span data-boot-progress-bar></span>
          </div>
        </div>
        <button class="boot-screen__skip" type="button" data-boot-skip>
          Skip intro <span>ESC</span>
        </button>
      </div>

      <span class="boot-screen__corner boot-screen__corner--tl" aria-hidden="true"></span>
      <span class="boot-screen__corner boot-screen__corner--tr" aria-hidden="true"></span>
      <span class="boot-screen__corner boot-screen__corner--bl" aria-hidden="true"></span>
      <span class="boot-screen__corner boot-screen__corner--br" aria-hidden="true"></span>
    </section>
    <div id="app" inert aria-hidden="true"></div>
    <noscript>
      <style>.boot-screen { display: none; }</style>
      <p class="noscript-message">NEXUS requires JavaScript to run this interface.</p>
    </noscript>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
