name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install production build tools
        run: npm ci --ignore-scripts

      - name: Audit build toolchain
        run: npm audit --audit-level=high

      - name: Build production worker
        run: npm run build

      - name: Run application quality gates
        run: npm run validate
